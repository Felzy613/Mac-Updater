name: Build and Release

# Runs on every push to main. The version-bump commit uses [skip ci] so it
# doesn't re-trigger the workflow.
on:
  push:
    branches: [main]

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      SCHEME: MacUpdater
      XCODE_PROJECT: MacUpdater.xcodeproj
      TEAM_ID: J97QDPV6YC
      BUNDLE_ID: FelzyTech.MacUpdater

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 2. Bump version ───────────────────────────────────────────────────────
      - name: Bump version
        id: ver
        run: |
          python3 .github/scripts/bump_version.py "${{ github.event.head_commit.message }}" \
            >> "$GITHUB_OUTPUT"

      # ── 3. Import signing certificate ─────────────────────────────────────────
      - name: Set up signing
        id: signing
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "::notice::No MACOS_CERTIFICATE secret — build will be ad-hoc signed (not distributable)"
            echo "identity=" >> "$GITHUB_OUTPUT"
            echo "keychain=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KC_PATH="$RUNNER_TEMP/build.keychain"
          KC_PWD=$(openssl rand -hex 16)

          echo "$CERT_B64" | base64 --decode > /tmp/certificate.p12

          security create-keychain -p "$KC_PWD" "$KC_PATH"
          security set-keychain-settings -lut 21600 "$KC_PATH"
          security unlock-keychain -p "$KC_PWD" "$KC_PATH"
          security import /tmp/certificate.p12 \
            -k "$KC_PATH" \
            -P "$CERT_PWD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security list-keychain -d user -s "$KC_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PWD" "$KC_PATH"
          rm /tmp/certificate.p12

          IDENTITY=$(security find-identity -p codesigning -v "$KC_PATH" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -p codesigning -v "$KC_PATH" \
              | awk -F'"' '/Apple Development/ {print $2; exit}')
          fi

          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KC_PATH" >> "$GITHUB_OUTPUT"
          echo "::notice::Signing identity: $IDENTITY"

      # ── 4. Archive ────────────────────────────────────────────────────────────
      - name: Archive
        run: |
          IDENTITY="${{ steps.signing.outputs.identity }}"
          CODE_SIGN_ID="${IDENTITY:--}"

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_ID" \
            ONLY_ACTIVE_ARCH=NO \
            | grep -E "(error:|warning:|Build succeeded|Build failed)" || true

      # ── 5. Export .app ────────────────────────────────────────────────────────
      - name: Export
        run: |
          IDENTITY="${{ steps.signing.outputs.identity }}"

          if [[ "$IDENTITY" == *"Developer ID Application"* ]]; then
            cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/app.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$RUNNER_TEMP/export"
          else
            mkdir -p "$RUNNER_TEMP/export"
            find "$RUNNER_TEMP/app.xcarchive/Products/Applications" \
              -maxdepth 1 -name "*.app" -exec cp -r {} "$RUNNER_TEMP/export/" \;
          fi

      # ── 5b. Verify the background helper got embedded ────────────────────────
      - name: Verify embedded helper
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name "*.app" | head -1)
          HELPER_PATH="$APP_PATH/Contents/Library/LoginItems/MacUpdater Helper.app"

          if [ ! -d "$HELPER_PATH" ]; then
            echo "::error::Background helper not found at $HELPER_PATH — the Copy Files build phase may be broken"
            exit 1
          fi
          echo "Helper embedded: $HELPER_PATH"

      # ── 6. Build .pkg installer ───────────────────────────────────────────────
      - name: Build .pkg
        id: pkg
        run: |
          NEW_VERSION="${{ steps.ver.outputs.new_version }}"
          APP_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name "*.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in $RUNNER_TEMP/export/"
            exit 1
          fi
          echo "Packaging: $APP_PATH"

          PKG_NAME="Mac-Updater-${NEW_VERSION}.pkg"
          PKG_PATH="$RUNNER_TEMP/$PKG_NAME"

          pkgbuild \
            --component "$APP_PATH" \
            --install-location /Applications \
            --identifier "$BUNDLE_ID" \
            --version "$NEW_VERSION" \
            --scripts ".github/scripts/pkg-scripts" \
            "$PKG_PATH"

          echo "pkg_path=$PKG_PATH"   >> "$GITHUB_OUTPUT"
          echo "pkg_name=$PKG_NAME"   >> "$GITHUB_OUTPUT"
          echo "  $(du -h "$PKG_PATH" | awk '{print $1}')  $PKG_NAME"

      # ── 7. Commit version bump & tag ────────────────────────────────────────
      - name: Commit & tag
        run: |
          NEW_VERSION="${{ steps.ver.outputs.new_version }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$XCODE_PROJECT/project.pbxproj"
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin main "v${NEW_VERSION}"

      # ── 8. Create GitHub Release ─────────────────────────────────────────────
      - name: Write release notes
        run: |
          printf '%s' "${{ github.event.head_commit.message }}" \
            | grep -v '\[skip ci\]' \
            > "$RUNNER_TEMP/release_notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.new_version }}
          name: "Mac Updater v${{ steps.ver.outputs.new_version }}"
          body_path: ${{ runner.temp }}/release_notes.md
          files: ${{ steps.pkg.outputs.pkg_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 9. Cleanup ───────────────────────────────────────────────────────────
      - name: Delete keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" 2>/dev/null || true
